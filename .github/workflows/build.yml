name: Build BibliaTV Release

on:
  push:
    branches: [ main, reconstruccion-limpia ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta el secreto KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/muro-key.jks
          test -s app/muro-key.jks
          chmod 600 app/muro-key.jks

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compilar APK Release firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Faltan secretos de firma"
            exit 1
          fi
          ./gradlew assembleRelease

      - name: Eliminar llave temporal
        if: always()
        run: rm -f app/muro-key.jks

      - name: Publicar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: BibliaTV-Release-Firmado
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
